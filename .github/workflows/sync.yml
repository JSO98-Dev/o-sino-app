name: Edições

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '37,47,57 8 * * 1-5'
    - cron: '7,17,27,37 9 * * 1-5'
    - cron: '17,23,29,37,43 14 * * 1-5'
    - cron: '13,19,23,29,33,39 21 * * 1-5'
    - cron: '53 20 * * 0'
    - cron: '7,13,19,23,29,37 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/sync.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git add -A editions.json midia 2>/dev/null || git add editions.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Edições"
          git push

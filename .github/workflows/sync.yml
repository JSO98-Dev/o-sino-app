name: Edições

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '7,17,27,37,47,57 9,10 * * *'
    - cron: '3,13,23,33,43,53 15 * * 1-5'
    - cron: '13,23,33,43,53 22 * * 1-5'
    - cron: '7,27,47 21,22 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/sync.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git add -A editions.json midia 2>/dev/null || git add editions.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Edições"
          git push
